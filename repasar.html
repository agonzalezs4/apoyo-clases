<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repasar</title>
<link rel="stylesheet" href="estilos.css">
<script src="config.js"></script>
<script src="repo.js"></script>
<script src="recopilar.js"></script>
<style>
  main { max-width: 560px; margin: 0 auto; padding: 28px 20px 48px; }
  h1 { font-size: 20px; font-weight: 600; line-height: 1.35; margin: 0 0 22px; }
  #tema { color: var(--suave); font-size: 15px; margin: 0 0 6px; }
  #zona { display: grid; gap: 12px; }
  #zona button, #aviso button {
    text-align: left; font-size: 18px; padding: 14px 16px; min-height: 56px; touch-action: manipulation;
    background: #fff; border: 2px solid var(--riel); border-radius: 6px;
  }
  #zona button.bien { background: var(--barra); border-color: var(--barra); color: #fff; }
  #zona button:disabled:not(.bien) { opacity: .5; cursor: default; }
  #zona button.accion, #aviso button { text-align: center; background: var(--barra); border-color: var(--barra); color: #fff; }
  #retro { font-size: 17px; margin-top: 18px; }
</style>
</head>
<body>
<main>
  <p id="tema"></p>
  <h1 id="pregunta">Cargando…</h1>
  <div id="aviso"></div>
  <div id="zona"></div>
  <p id="retro" aria-live="polite"></p>
  <p id="error" class="error"></p>
</main>
<script>
// Repaso de práctica, sin nota. Archivo de clases/ con preguntas "alt" que traen "correcta" (índice desde 0),
// y opcionalmente "tema", "retro" (un texto por alternativa) y "explicacion".
// repasar.html?clase=repaso-demo
const nombre = new URLSearchParams(location.search).get("clase") || "";
let clase, preguntas, i, aciertos;

function boton(texto, alPulsar, accion) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = texto;
  if (accion) b.className = "accion";
  b.onclick = () => alPulsar(b);
  $("zona").appendChild(b);
  return b;
}
function pantalla(tema, titulo) {
  $("tema").textContent = tema;
  $("pregunta").textContent = titulo;
  $("aviso").textContent = $("zona").textContent = $("retro").textContent = "";
}

function inicio() {
  pantalla("", `Repaso: ${preguntas.length} ${preguntas.length === 1 ? "pregunta" : "preguntas"} para practicar`);
  // con "recopilar": true los dos botones del aviso son los que comienzan
  if (!Recopilar.aviso(nombre, clase, $("aviso"), comenzar)) boton("Comenzar", comenzar, true);
}
function comenzar() { i = 0; aciertos = 0; mostrar(); }

function mostrar() {
  const p = preguntas[i];
  let primero = true;
  pantalla(`${p.tema ? p.tema + " · " : ""}${i + 1} de ${preguntas.length}`, p.texto);
  p.opciones.forEach((texto, k) => boton(texto, b => {
    const bien = k === p.correcta;
    $("retro").textContent = (bien ? "Correcto. " : "Incorrecto. ") + ((p.retro || [])[k] || "") + (bien && p.explicacion ? " " + p.explicacion : "");
    if (primero) { primero = false; if (bien) aciertos++; Recopilar.registrar(p.id, p.tema, texto, bien); } // después de la retroalimentación: no la retrasa
    b.disabled = true;
    if (!bien) return; // puede seguir intentando
    b.className = "bien";
    $("zona").querySelectorAll("button").forEach(x => { x.disabled = true; });
    boton(i + 1 < preguntas.length ? "Siguiente" : "Terminar", () => { if (++i < preguntas.length) mostrar(); else fin(); }, true).focus();
  }));
}

function fin() {
  Recopilar.terminar();
  pantalla("", `Acertaste ${aciertos} de ${preguntas.length} al primer intento`);
  boton("Volver al inicio", inicio, true);
}

cargarClase(nombre).then(c => {
  clase = c;
  preguntas = c.p.filter(p => p.tipo === "alt" && !p.multi && Array.isArray(p.opciones) && p.opciones[p.correcta] != null);
  if (!preguntas.length) throw new Error("Esta clase no tiene preguntas de repaso (alternativas con «correcta»).");
  inicio();
}).catch(e => { $("pregunta").textContent = ""; $("error").textContent = e.message; });
</script>
</body>
</html>
