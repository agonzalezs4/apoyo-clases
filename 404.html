<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abriendo…</title>
</head>
<body style="font-family: system-ui, sans-serif; padding: 24px; font-size: 18px;">
<p id="m">Abriendo la pregunta…</p>
<script>
(async () => {
  const partes = location.pathname.split("/").filter(Boolean);
  const codigo = decodeURIComponent(partes.pop() || "").toLowerCase().trim();
  const base = partes.length ? "/" + partes[0] + "/" : "/";
  const existe = async n => {
    try { return (await fetch(`${base}clases/${encodeURIComponent(n)}.json`, { cache: "no-store" })).ok; }
    catch (e) { return false; }
  };
  const opciones = [[codigo, 1], ["clase-" + codigo, 1]];
  const m = codigo.match(/^(.+)-(\d+)$/);
  if (m) opciones.push([m[1], Number(m[2])], ["clase-" + m[1], Number(m[2])]);
  for (const [clase, p] of opciones) {
    if (await existe(clase)) {
      location.replace(`${base}votar.html?clase=${encodeURIComponent(clase)}&p=${p}`);
      return;
    }
  }
  document.getElementById("m").textContent = `No encontré «${codigo}». Revisa la dirección que aparece en pantalla.`;
})();
</script>
</body>
</html>
