<script>

// Cálculos en vivo. Las celdas a, b, c y d siguen el orden de la tabla del laboratorio.
const Z95 = 1.959963984540054;
function logInterval(estimate, se) {
  if (!Number.isFinite(estimate) || estimate <= 0 || !Number.isFinite(se))

  return {

function wilsonInterval(x, n) {

  const margin = Z95 * Math.sqrt((p * (1 - p) + z2 / (4 * n)) / n) / denominator;
  return { low: Math.max(0, center - margin), high: Math.min(1, center + margin) };

// Newcombe: más estable que Wald en muestras pequeñas y con proporciones extremas.
function riskDifferenceInterval(a, nE, c, nNE) {

    return null;
  const exposed = wilsonInterval(a, nE);
  const unexposed = wilsonInterval(c, nNE);
  if (!exposed || !unexposed)
    return null;

  const ine = c / nNE;

    low: Math.max(-1, estimate - Math.sqrt((ie - exposed.low) ** 2 + (unexposed.high - ine) ** 2)),

// Función de supervivencia de χ² con 1 gl: P(χ² ≥ x) = erfc(√(x/2)).
function chiSquare1P(x) {

// Historia. El paso decide cómo agrupar y colorear los mismos veinte participantes.
// Tiempo de lectura en automático. En modo manual cada paso dura hasta el siguiente toque.
const secondsPerStep = 8;
const steps = [
  { title: 'Círculo = persona.', text: 'Toca un círculo para ver su ficha.' },
  { title: '10 con y 10 sin IBP.', text: 'IBP significa inhibidor de la bomba de protones.' },

  return h("button", { className: `person-token ${tone}`, "data-person": person.id, onClick: () => onSelect(person), "aria-label": `Persona ${person.id}: ${person.exposed ? 'uso prolongado de IBP' : 'sin uso prolongado'}, ${person.deficit ? 'con déficit' : 'sin déficit'}` },

// Medimos las posiciones respecto al tablero para que el desplazamiento de la página
// no altere el recorrido de los círculos. Se lee la geometría de todos antes de dibujar.
function tokenPositions(board) {
  const origin = board.getBoundingClientRect();
  const positions = new Map();
  for (const token of board.querySelectorAll('[data-person]')) {
    const rect = token.getBoundingClientRect();
    positions.set(token.dataset.person, { token, x: rect.left - origin.left, y: rect.top - origin.top });
  }
  return positions;
