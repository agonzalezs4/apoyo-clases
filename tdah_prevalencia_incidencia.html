<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TDAH: prevalencia e incidencia</title>
<style>
  /* Estilo USS, como fisher-te/index.html */
  :root{
    --azul:#102b42; --gris:#475c69; --oro:#cfb47c; --miel:#86632d;
    --papel:#faf8f1; --linea:#d2cfc2; --arena:#f0e9d9;
    --nuevo:#9a3b1b; --previo:#86632d; --marca:#f6e7c1;
    --sans:Montserrat,"Segoe UI",Arial,sans-serif; --serif:Georgia,"Times New Roman",serif;
    --margen:clamp(14px,4.4vw,64px);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--papel);color:var(--azul);font:16px/1.45 var(--sans)}
  .barra{display:flex;align-items:center;gap:14px;padding:10px var(--margen);background:#fff;border-bottom:1px solid var(--linea)}
  .barra img{width:116px;height:auto;display:block}
  .barra span{border-left:1px solid var(--linea);padding-left:14px;font-size:14px;font-weight:600}
  main{max-width:1180px;margin:0 auto;padding:clamp(18px,4vh,44px) var(--margen) 40px}
  .ceja{font:700 12px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--miel);margin:0 0 10px}
  h1{font:400 clamp(36px,5vw,64px)/1.02 var(--serif);letter-spacing:-.05em;margin:0}
  h1 em{color:var(--miel)}
  .controles{display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px;margin:22px 0 6px}
  .segmentos{display:flex;flex-wrap:wrap;gap:6px}
  .segmentos button{font:650 15px var(--sans);color:var(--azul);background:#fff;border:1px solid #9caab0;border-radius:5px;min-height:44px;padding:4px 14px;cursor:pointer}
  .segmentos button[aria-pressed=true]{background:var(--azul);color:#fff;border-color:var(--azul)}
  .corte{display:flex;align-items:center;gap:10px;flex:1 1 240px;font-weight:650}
  .corte input{flex:1;min-width:0;accent-color:var(--azul)}
  :where(button,input):focus-visible{outline:3px solid #28759e;outline-offset:2px}
  .formula{margin:4px 0 18px;color:var(--gris);font-size:15px}
  .formula b{color:var(--azul)}
  .par{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.8fr);gap:clamp(18px,4vw,56px);align-items:start}
  .leyenda{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;margin:0 0 6px}
  .leyenda b{font-weight:700}
  svg{width:100%;height:auto;display:block}
  .tarjetas{display:grid;gap:14px}
  .lamina{padding:16px 20px;background:var(--arena);border:1px solid #d9c9a7;border-top:3px solid var(--oro);border-radius:6px}
  .lamina h2{font:650 15px var(--sans);margin:0}
  .grande{font:400 clamp(40px,4.4vw,60px)/1.1 var(--serif);letter-spacing:-.045em;margin:2px 0}
  .grande .u{font:600 14px var(--sans);letter-spacing:0;color:var(--gris)}
  .frac{font-weight:600;font-variant-numeric:tabular-nums}
  .frac small{color:var(--gris);font-weight:400;font-size:13px}
  .puntos{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
  .puntos i{width:13px;height:13px;border-radius:50%;border:1px solid var(--azul);background:#fff}
  .puntos i.n{background:var(--nuevo);border-color:var(--nuevo)}
  .puntos i.p{background:var(--previo);border-color:var(--previo);border-radius:2px}
  .puntos i.x{opacity:.25;border-radius:2px;background:var(--previo);border-color:var(--previo)}
  @media(max-width:760px){
    .barra img{width:100px} .barra span{font-size:12px;padding-left:10px}
    .par{grid-template-columns:minmax(0,1fr)}
    .segmentos{display:grid;grid-template-columns:repeat(3,1fr);width:100%}
    .segmentos button{font-size:13px;padding:4px 6px;line-height:1.2}
    .tarjetas{grid-template-columns:1fr 1fr;gap:10px}
    .lamina{padding:12px}
    .grande{font-size:34px}
  }
</style>
</head>
<body>
<header class="barra"><img src="lib/marca-uss.png" alt="Universidad San Sebastián"><span>Epidemiología</span></header>
<main>
  <p class="ceja">Datos hipotéticos · 1° básico, un año</p>
  <h1>TDAH en <em>dos escuelas</em></h1>

  <div class="controles">
    <div class="segmentos" role="group" aria-label="Medida">
      <button type="button" data-m="pp" aria-pressed="true">Prevalencia de período</button>
      <button type="button" data-m="ia" aria-pressed="false">Incidencia acumulada</button>
      <button type="button" data-m="tasa" aria-pressed="false">Tasa de incidencia</button>
    </div>
    <label class="corte"><span id="tval"></span><input type="range" id="tcut" min="1" step="1"></label>
  </div>
  <p class="formula" id="formula"></p>

  <div class="par">
    <div>
      <div class="leyenda" id="leyenda"></div>
      <svg id="grafico" role="img" aria-label="Seguimiento de cada escolar de las dos escuelas hasta el corte t"></svg>
    </div>
    <div class="tarjetas" id="tarjetas"></div>
  </div>
</main>

<script>
/* ===================== EDITA AQUÍ =====================
   Cada escolar: [meses observados, estado]
     2 = ya tenía TDAH al inicio (caso previo)
     1 = diagnóstico nuevo a los "meses" indicados
     0 = sin TDAH al final de su observación (fin de año o se cambió de colegio)
   rep(8, 12, 0) = 8 escolares observados 12 meses sin TDAH */
const rep = (n, t, e) => Array.from({length:n}, () => [t, e]);
const GRUPOS = [
  { nombre: "Escuela A", personas: [...rep(4,12,2), [5,1],[9,1], [4,0], ...rep(8,12,0)] },
  { nombre: "Escuela B", personas: [[12,2], [2,1],[3,1],[6,1], [2,0],[3,0],[3,0],[5,0], ...rep(7,12,0)] }
];
const T_MAX = 12, POR = 100;   // tasa por 100 persona-meses
/* ===================== FIN DE LO EDITABLE ===================== */

const $ = id => document.getElementById(id);
const fmt = v => v.toFixed(1).replace(".", ",");
const FORMULAS = {
  pp:   "<b>Prevalencia de período</b> = (casos previos + nuevos hasta t) ÷ todos los escolares",
  ia:   "<b>Incidencia acumulada</b> = nuevos hasta t ÷ escolares sin TDAH al inicio",
  tasa: "<b>Tasa de incidencia</b> = nuevos hasta t ÷ meses en riesgo hasta t"
};
let modo = "pp", T = T_MAX;

// La incidencia solo mira a quienes podían ser un caso nuevo: los previos quedan fuera
const calc = g => {
  const n = g.personas.length;
  const pre = g.personas.filter(([,e]) => e === 2).length;
  const nue = g.personas.filter(([t,e]) => e === 1 && t <= T).length;
  const riesgo = g.personas.filter(([,e]) => e !== 2);
  const pt = riesgo.reduce((s,[t]) => s + Math.min(t,T), 0);
  return { n, pre, nue, nR: riesgo.length, pt, pp: (pre+nue)/n, ia: nue/riesgo.length, tasa: POR*nue/pt };
};

function grafico(){
  const svg = $("grafico"), W = svg.clientWidth || 600, movil = W < 520;
  const fila = movil ? 15 : 13, cab = 26, sep = 14, izq = 10, der = 14, arriba = 22, abajo = 34;
  const H = arriba + GRUPOS.reduce((s,g) => s + cab + g.personas.length*fila + sep, 0) + abajo;
  const x = t => izq + 8 + (W - izq - der - 8) * t / T_MAX;
  const fuera = e => modo !== "pp" && e === 2;
  let s = "", y = arriba;
  GRUPOS.forEach(g => {
    s += `<text x="${izq}" y="${y+16}" font-weight="650" font-size="14" fill="var(--azul)">${g.nombre}</text>`;
    y += cab;
    g.personas.forEach(([t,e]) => {
      const cy = y + fila/2, cuenta = (e === 1 && t <= T) || (modo === "pp" && e === 2);
      s += `<g opacity="${fuera(e) ? .22 : 1}">`;
      if (cuenta) s += `<rect x="${izq}" y="${y+1}" width="${x(T)-izq}" height="${fila-2}" rx="3" fill="var(--marca)"/>`;
      if (modo === "tasa" && !fuera(e))
        s += `<line x1="${x(0)}" x2="${x(Math.min(t,T))}" y1="${cy}" y2="${cy}" stroke="var(--azul)" stroke-width="${movil?6:5}" stroke-linecap="round"/>`;
      s += `<line x1="${x(0)}" x2="${x(t)}" y1="${cy}" y2="${cy}" stroke="var(--azul)" stroke-opacity=".35"/>`;
      if (e === 2) s += `<rect x="${x(0)-5}" y="${cy-5}" width="10" height="10" fill="var(--previo)"/>`;
      if (e === 1) s += `<path d="M${x(t)-4.5},${cy-4.5}l9,9m0,-9l-9,9" stroke="var(--nuevo)" stroke-width="2.6"/>`;
      else s += `<circle cx="${x(t)}" cy="${cy}" r="3.8" fill="#fff" stroke="var(--azul)" stroke-width="1.6"/>`;
      s += `</g>`;
      y += fila;
    });
    y += sep;
  });
  const fin = y - sep;
  // Lo posterior a t no cuenta
  if (T < T_MAX) s += `<rect x="${x(T)}" y="${arriba-4}" width="${x(T_MAX)-x(T)+6}" height="${fin-arriba+6}" fill="var(--papel)" opacity=".75"/>`;
  s += `<line x1="${x(T)}" x2="${x(T)}" y1="${arriba-10}" y2="${fin+2}" stroke="var(--oro)" stroke-width="3"/>`;
  s += `<text x="${Math.min(Math.max(x(T),40),W-40)}" y="${arriba-12}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--azul)">t = ${T}</text>`;
  for (let m = 0; m <= T_MAX; m += movil ? 2 : 1)
    s += `<line x1="${x(m)}" x2="${x(m)}" y1="${fin+4}" y2="${fin+8}" stroke="var(--gris)"/><text x="${x(m)}" y="${fin+21}" text-anchor="middle" font-size="12" fill="var(--gris)">${m}</text>`;
  s += `<text x="${W/2}" y="${H-2}" text-anchor="middle" font-size="12" fill="var(--gris)">meses desde el inicio del año escolar</text>`;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = s;
}

function tarjetas(){
  $("tarjetas").innerHTML = GRUPOS.map(g => {
    const c = calc(g), pts = (k,n) => `<i class="${k}"></i>`.repeat(n);
    const v = modo === "pp"
      ? [`${fmt(100*c.pp)} %`, `(${c.pre} + ${c.nue}) / ${c.n}`, pts("p",c.pre) + pts("n",c.nue) + pts("",c.n-c.pre-c.nue)]
      : modo === "ia"
      ? [`${fmt(100*c.ia)} %`, `${c.nue} / ${c.nR} <small>(sin ${c.pre} previo${c.pre===1?"":"s"})</small>`, pts("n",c.nue) + pts("",c.nR-c.nue) + pts("x",c.pre)]
      : [`${fmt(c.tasa)}<span class="u"> por ${POR}</span>`, `${c.nue} / ${c.pt} persona-meses`, ""];
    return `<div class="lamina"><h2>${g.nombre}</h2><div class="grande">${v[0]}</div>
      <div class="frac">${v[1]}</div>${v[2] ? `<div class="puntos" aria-hidden="true">${v[2]}</div>` : ""}</div>`;
  }).join("");
}

function leyenda(){
  $("leyenda").innerHTML = `<span><b style="color:var(--previo)">■</b> caso previo${modo==="pp" ? "" : " (fuera)"}</span>
    <span><b style="color:var(--nuevo)">✕</b> caso nuevo</span><span><b>○</b> fin de la observación</span>`;
}

function dibujar(){
  $("tval").textContent = `t = ${T} ${T===1 ? "mes" : "meses"}`;
  $("formula").innerHTML = FORMULAS[modo];
  leyenda(); grafico(); tarjetas();
}

const deslizador = $("tcut");
deslizador.max = T_MAX; deslizador.value = T;
deslizador.addEventListener("input", e => { T = +e.target.value; dibujar(); });
document.querySelectorAll(".segmentos button").forEach(b => b.addEventListener("click", () => {
  modo = b.dataset.m;
  document.querySelectorAll(".segmentos button").forEach(o => o.setAttribute("aria-pressed", o === b));
  dibujar();
}));
let ancho = innerWidth;
addEventListener("resize", () => { if (Math.abs(innerWidth - ancho) > 20) { ancho = innerWidth; grafico(); } });
dibujar();
</script>
</body>
</html>
