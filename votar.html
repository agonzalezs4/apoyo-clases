<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Responder</title>
<link rel="stylesheet" href="estilos.css">
<script src="config.js"></script>
<script src="repo.js"></script>
<style>
  main { max-width: 560px; margin: 0 auto; padding: 28px 20px 48px; }
  h1 { font-size: 24px; line-height: 1.3; margin: 0 0 22px; }
  .opciones { display: grid; gap: 12px; }
  .opcion {
    text-align: left; font-size: 20px; padding: 16px 18px; min-height: 60px;
    background: #fff; border: 2px solid var(--riel); border-radius: 6px;
  }
  .opcion[aria-pressed="true"], .opcion.elegida { background: var(--barra); border-color: var(--barra); color: #fff; }
  .opcion:disabled:not(.elegida) { opacity: .5; cursor: default; }
  .escala { display: grid; grid-template-columns: repeat(auto-fit, minmax(46px, 1fr)); gap: 8px; }
  .escala .opcion { text-align: center; padding: 14px 0; }
  .extremos { display: flex; justify-content: space-between; color: var(--suave); margin-top: 8px; font-size: 16px; }
  textarea, input {
    width: 100%; font: inherit; font-size: 20px; padding: 12px 14px; color: var(--tinta);
    border: 2px solid var(--riel); border-radius: 6px; background: #fff;
  }
  textarea:focus, input:focus { outline: none; border-color: var(--barra); }
  .numero { display: flex; gap: 10px; align-items: center; font-size: 20px; }
  .enviar {
    margin-top: 14px; width: 100%; font-size: 20px; padding: 14px; border: 0; border-radius: 6px;
    background: var(--barra); color: #fff;
  }
  .enviar:disabled { opacity: .5; cursor: default; }
  .cuenta { text-align: right; color: var(--suave); font-size: 14px; margin-top: 4px; }
  #mensaje { font-size: 18px; color: var(--suave); margin-top: 20px; }
  #codigo { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 18px; padding: 8px 14px; background: #fff; border: 2px dashed var(--riel); border-radius: 6px; color: var(--suave); font-size: 15px; line-height: 1.3; }
  #codigo[hidden] { display: none; }
  #codigo small { display: block; font-size: 13px; }
  #codigo b { color: var(--tinta); font-size: 32px; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
  html, body { overscroll-behavior-x: none; }
  body { overflow-x: hidden; }
  #nav { position: sticky; bottom: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 28px; padding: 10px 0; background: var(--papel); }
  #nav button { width: auto; margin: 0; padding: 12px 18px; min-width: 56px; touch-action: manipulation; }
  #pos { color: var(--suave); font-size: 16px; }
  .resumen { display: grid; gap: 10px; }
  .fila { width: 100%; text-align: left; font-size: 17px; line-height: 1.3; padding: 12px 14px; background: #fff; border: 2px solid var(--riel); border-radius: 6px; }
  .fila span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .fila small { display: block; margin-top: 4px; font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
  .fila small.falta { color: var(--aviso); }
  .fila:disabled { opacity: 1; cursor: default; }
</style>
</head>
<body>
<main>
  <div id="codigo" hidden><span>Tu código para el sorteo<small>Vale para toda la tanda</small></span><b></b></div>
  <h1 id="pregunta">Cargando…</h1>
  <div id="zona"></div>
  <p id="mensaje" aria-live="polite"></p>
  <p id="error" class="error"></p>
</main>

<script>
let p = null;               // pregunta en pantalla (null en la pantalla final "Revisa y responde")
let tanda = [];             // todas las preguntas de la tanda
let clase = null, claseNombre = "", idx = 0, tEstado = 0;
let enviando = false;       // hay un envío de la tanda en marcha
let ultEstado = 0;          // cuándo se consultaron las rondas por última vez
const mem = {};             // respaldo si el navegador no deja usar localStorage
const LISTO = "Tus respuestas quedaron registradas. Si se abre una nueva ronda, podrás responder de nuevo aquí mismo.";
const pref = () => claseNombre ? claseNombre + "/" : "";
const claveVoto = (id, r) => `voto-${pref()}${id}-${r}`;  // lo ya enviado de esa pregunta en esa ronda
const claveRonda = id => `ronda-${pref()}${id}`;
const claveBorr = id => `borr-${pref()}${id}`;            // lo marcado pero todavía sin enviar
const claveNum = () => `num-${claseNombre}`;  // los dígitos que este celular eligió para la tanda
const claveCod = () => `cod-${claseNombre}`;  // el código completo (letra + dígitos), cuando el servidor lo devolvió
const espera = ms => new Promise(res => setTimeout(res, ms));
const leer = k => { try { const v = localStorage.getItem(k); if (v !== null) return v; } catch (e) {} return k in mem ? mem[k] : null; };
const guardar = (k, v) => { mem[k] = String(v); try { localStorage.setItem(k, v); } catch (e) {} };
const olvidar = k => { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} };

const rondaDe = id => leer(claveRonda(id));
const enviada = q => leer(claveVoto(q.id, rondaDe(q.id)));  // lo enviado en la ronda vigente, o null
const borrador = q => leer(claveBorr(q.id)) || "";
const hayResumen = () => tanda.length > 1;                   // la pantalla final solo tiene sentido con varias preguntas
const ultimo = () => hayResumen() ? tanda.length : tanda.length - 1;
const enResumen = () => !p;

// Lo marcado de una pregunta, si está listo para enviarse; null si falta o no vale
function respuestaDe(q) {
  const v = borrador(q).trim();
  if (!v) return null;
  if (q.tipo === "num") return aNumero(v) === null ? null : v;
  if (q.tipo === "esc") { const x = Number(v); return Number.isInteger(x) && x >= q.min && x <= q.max ? v : null; }
  if (q.tipo === "alt") { const s = v.split(SEP); return s.every(o => q.opciones.includes(o)) && (q.multi || s.length === 1) ? v : null; }
  return v;
}
const pendientes = () => tanda.filter(q => enviada(q) === null);
// Lo enviado se guarda tal cual; "" = el estudiante pulsó «Responder» dejando esa pregunta en blanco (queda cerrada en esa ronda)
const numeros = qs => qs.map(q => tanda.indexOf(q) + 1).join(", ");

// Un solo código por celular y por tanda (clase-##-#): se elige aquí, sin consultar al servidor. La letra la agrega el servidor.
function digitosTanda() {
  let n = leer(claveNum());
  const base = 10 ** (DIGITOS_CODIGO - 1); // sin cero a la izquierda: 5 dígitos van de 10000 a 99999
  if (!new RegExp(`^[1-9]\\d{${DIGITOS_CODIGO - 1}}$`).test(n || "")) { n = String(base + Math.floor(Math.random() * 9 * base)); guardar(claveNum(), n); }
  return n;
}
function mostrarCodigo() {
  let c = claseNombre ? leer(claveCod()) : null;
  if (c && c.length !== DIGITOS_CODIGO + 1) c = null; // un código guardado con otro largo (versión anterior) ya no vale
  $("codigo").hidden = !c;
  if (c) $("codigo").querySelector("b").textContent = c;
}

// Igual que api(), pero con tiempo máximo: si el servidor no responde, se reintenta en vez de quedar colgado
async function llamar(params, ms = 15000) {
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), ms);
  try {
    const r = await fetch(SCRIPT_URL + "?" + new URLSearchParams(params) + "&_=" + Date.now(), { signal: ac.signal });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    return d;
  } finally { clearTimeout(t); }
}

// Un corte breve de la red del aula no debe mostrar "enlace no válido"
async function cargarConReintento(nombre) {
  let ultimo;
  for (let k = 0; k < 4; k++) {
    try { return await cargarClase(nombre); }
    catch (e) {
      ultimo = e;
      if (!(e instanceof TypeError) && k >= 1) break; // 404 o archivo dañado: no tiene sentido insistir
      if (k < (e instanceof TypeError ? 3 : 1)) { $("pregunta").textContent = "Cargando… la conexión está lenta"; await espera(600 * (k + 1) + Math.random() * 600); }
    }
  }
  throw ultimo;
}

// lz-string solo hace falta en el modo antiguo (pregunta dentro del enlace); así no bloquea la carga normal
function cargarLZ() {
  return new Promise((ok, mal) => {
    if (typeof LZString !== "undefined") return ok();
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js";
    s.onload = ok;
    s.onerror = () => mal(new TypeError("lz-string"));
    document.head.appendChild(s);
  });
}

// El gráfico embebido avisa su alto: así se ve completo, sin una segunda barra de desplazamiento dentro de la pregunta
addEventListener("message", e => {
  const f = document.getElementById("pagina");
  if (!f || e.source !== f.contentWindow || !e.data || e.data.tipo !== "alto-widget") return;
  const h = Number(e.data.alto);
  if (h > 100 && h < 5000) f.style.height = h + "px";
});

iniciar();

async function iniciar() {
  const qs = new URLSearchParams(location.search);
  let fallaRed = false;
  try {
    if (qs.get("clase")) {
      claseNombre = qs.get("clase");
      clase = await cargarConReintento(claseNombre);
      tanda = clase.p;
      const k = tanda.findIndex(x => x.id === qs.get("q"));
      idx = k >= 0 ? k : Math.min(Math.max(0, (Number(qs.get("p")) || 1) - 1), ultimo());
    } else {
      await cargarLZ();
      const unica = desempaquetar(location.hash.slice(1));
      tanda = unica ? [unica] : [];
    }
  } catch (e) { tanda = []; fallaRed = e instanceof TypeError; }
  if (!tanda.length) {
    $("pregunta").textContent = fallaRed
      ? "No se pudo cargar la pregunta. Revisa tu conexión y vuelve a abrir el enlace."
      : "Este enlace no es válido. Vuelve a escanear el QR.";
    return;
  }
  if (hayResumen()) armarNavegacion();
  mostrarPregunta(0);
  programarEstado();
  const alVolver = () => { if (!document.hidden && quiereEstado()) setTimeout(estado, Math.random() * 2000); };
  document.addEventListener("visibilitychange", alVolver);
  addEventListener("online", alVolver);
}

function armarNavegacion() {
  $("error").insertAdjacentHTML("afterend",
    `<div id="nav">
       <button id="ant" class="enviar" aria-label="Pregunta anterior">‹</button>
       <span id="pos" aria-live="polite"></span>
       <button id="sig" class="enviar" aria-label="Pregunta siguiente">›</button>
     </div>`);
  $("ant").onclick = () => ir(-1);
  $("sig").onclick = () => ir(1);
  engancharSwipe(document);
  document.addEventListener("keydown", e => {
    if (e.target.closest("input, textarea")) return;
    if (e.key === "ArrowRight") ir(1);
    if (e.key === "ArrowLeft") ir(-1);
  });
}

// Deslizar a la izquierda = siguiente, a la derecha = anterior. También se engancha dentro del iframe.
function engancharSwipe(doc) {
  let x0 = 0, y0 = 0, anula = false;
  doc.addEventListener("touchstart", e => {
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    const w = doc.defaultView.innerWidth;
    // dos dedos (zoom), campos de texto y los bordes (gesto "atrás" del navegador) no cuentan
    anula = e.touches.length > 1 || !!(e.target.closest && e.target.closest("input, textarea")) || x0 < 24 || x0 > w - 24;
  }, { passive: true });
  doc.addEventListener("touchcancel", () => { anula = true; }, { passive: true });
  doc.addEventListener("touchend", e => {
    if (anula) return;
    if (window.visualViewport && window.visualViewport.scale > 1.02) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 60 && Math.abs(dx) > 2 * Math.abs(dy)) ir(dx < 0 ? 1 : -1);
  }, { passive: true });
}

function actualizarNav() {
  if (!$("nav")) return;
  $("pos").textContent = enResumen() ? "Revisar" : `${idx + 1} / ${tanda.length}`;
  $("ant").disabled = idx === 0;
  $("sig").disabled = idx === ultimo();
  $("sig").setAttribute("aria-label", idx === tanda.length - 1 ? "Revisar y responder" : "Pregunta siguiente");
}

function mostrarPregunta(dir) {
  p = tanda[idx] || null; // fuera de la tanda = pantalla final
  $("pregunta").textContent = p ? p.texto : "Revisa y responde";
  const actual = document.getElementById("pagina");
  if (!p || !p.pagina) { if (actual) actual.remove(); }
  else if (!actual || actual.getAttribute("src") !== p.pagina) {
    if (actual) actual.remove();
    const f = document.createElement("iframe");
    f.id = "pagina";
    f.style.cssText = "width:100%;height:min(45vh,340px);border:0;margin-bottom:16px";
    f.onload = () => { try { engancharSwipe(f.contentDocument); } catch (e) {} };
    f.src = p.pagina;
    $("pregunta").after(f);
  }
  $("error").textContent = "";
  pintar(); // las opciones aparecen ya, sin esperar al servidor
  actualizarNav();
  const main = document.querySelector("main");
  if (dir && main.animate && !matchMedia("(prefers-reduced-motion: reduce)").matches)
    main.animate([{ transform: `translateX(${dir * 36}px)`, opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 180 });
  clearTimeout(tEstado);
  // Solo hace falta preguntar por las rondas si ya se envió algo (se espera una nueva); si no, al enviar el servidor las devuelve
  if (quiereEstado() && Date.now() - ultEstado > 45000) tEstado = setTimeout(estado, Math.random() * 4000);
}

function ir(d) {
  if (tanda.length < 2) return;
  const n = idx + d;
  if (n < 0 || n > ultimo()) return; // en los extremos no pasa nada
  idx = n;
  const u = new URL(location.href);
  u.searchParams.set("p", n + 1);
  u.searchParams.delete("q");
  history.replaceState(null, "", u);
  window.scrollTo(0, 0);
  mostrarPregunta(Math.sign(d));
}

function quiereEstado() { return tanda.some(q => enviada(q) !== null); }

// Consulta periódica (detecta si se abre una nueva ronda). Espaciada y con azar para no saturar al servidor.
function programarEstado() {
  setTimeout(() => { if (!document.hidden && quiereEstado()) estado(); programarEstado(); }, 60000 + Math.random() * 30000);
}

// Una sola consulta trae la ronda de todas las preguntas de la tanda
async function estado(intento = 0) {
  ultEstado = Date.now();
  try {
    const d = await llamar({ accion: "estados", qs: tanda.map(q => q.id).join(",") });
    if (!d.rondas) return;
    let cambio = false;
    tanda.forEach(q => {
      const nueva = d.rondas[q.id], vieja = rondaDe(q.id);
      if (nueva == null || String(nueva) === String(vieja)) return;
      if (vieja != null && Number(nueva) < Number(vieja)) return; // respuesta vieja llegada tarde
      const antes = enviada(q);
      guardar(claveRonda(q.id), nueva);
      if (antes !== enviada(q)) cambio = true; // solo se repinta si cambia lo que el estudiante ve
    });
    if (cambio && !enviando) pintar();
  } catch (e) {
    // consulta de fondo: si falla no se avisa; se reintenta unas veces
    if (intento < 2) setTimeout(() => estado(intento + 1), 5000 + Math.random() * 5000);
  }
}

// Envía de una vez las respuestas de la tanda: items = [[pregunta, respuesta, texto], ...]
async function enviarLote(items) {
  // mismo código en los reintentos, y también si se repite el toque (el servidor ignora el duplicado)
  const d = JSON.stringify(items);
  const kv = `v-${pref()}lote`;
  let v = null;
  try { const o = JSON.parse(leer(kv)); if (o && o.d === d) v = o.v; } catch (e) {}
  if (!v) { v = Math.random().toString(36).slice(2, 10); guardar(kv, JSON.stringify({ d, v })); }
  const mostrar = (m, e) => { $("mensaje").textContent = m; $("error").textContent = e || ""; };
  mostrar("Enviando…");
  const pausas = [1000, 2500, 5000, 8000, 8000, 8000, 8000];
  for (let k = 0; k <= pausas.length; k++) {
    try {
      const params = { accion: "lote", d, v };
      if (claseNombre) params.n = digitosTanda(); // en el modo antiguo (pregunta dentro del enlace) no hay tanda ni código
      const r = await llamar(params, 12000);
      olvidar(kv);
      mostrar("");
      if (r.codigo && claseNombre) guardar(claveCod(), r.codigo);
      return r;
    } catch (e) {
      if (k < pausas.length) {
        if (k >= 1) mostrar("Enviando… (la conexión está lenta, sigue esperando)");
        await espera(pausas[k] * (0.5 + Math.random()));
      }
    }
  }
  mostrar("", "No se pudieron enviar tus respuestas. Inténtalo de nuevo.");
  return null;
}

// Botón "Responder": manda todo lo pendiente de la tanda en una sola consulta.
// Las preguntas en blanco viajan solo con su id (el servidor no escribe fila; solo devuelve su ronda para cerrarlas aquí)
async function responder() {
  if (enviando) return;
  const pend = pendientes();
  const blancas = pend.filter(q => respuestaDe(q) === null);
  if (blancas.length === pend.length) return;
  if (blancas.length && !confirm(`Dejaste sin responder ${blancas.length === 1 ? "la pregunta" : "las preguntas"} ${numeros(blancas)}. Después de enviar ya no podrás cambiar tus respuestas. ¿Responder igual?`)) return;
  const items = pend.map(q => { const r = respuestaDe(q); return r === null ? [q.id] : [q.id, r, q.texto.slice(0, 80)]; });
  enviando = true;
  pintar();
  let d = null;
  try { d = await enviarLote(items); } finally { enviando = false; }
  if (d) {
    items.forEach(([id, r = ""]) => {
      const ronda = d.rondas && d.rondas[id] != null ? d.rondas[id] : rondaDe(id);
      guardar(claveVoto(id, ronda), r);
      if (d.rondas && d.rondas[id] != null) guardar(claveRonda(id), d.rondas[id]);
      olvidar(claveBorr(id));
    });
    window.scrollTo(0, 0);
  }
  pintar(); // si falló, el error ya está en pantalla y los borradores siguen ahí
}

function boton(texto, clase = "opcion") {
  const b = document.createElement("button");
  b.className = clase;
  b.textContent = texto;
  return b;
}

// Botón "Responder" con su aviso de qué falta; se usa en la pantalla final (o bajo la pregunta si la tanda es de una sola)
function panelEnvio() {
  const pend = pendientes();
  if (!pend.length) return;
  const blancas = pend.filter(q => respuestaDe(q) === null);
  const env = boton("Responder", "enviar");
  env.disabled = enviando || blancas.length === pend.length;
  env.onclick = responder;
  $("zona").appendChild(env);
  if (enviando) return;
  if (blancas.length === pend.length) { $("mensaje").textContent = hayResumen() ? "Marca al menos una respuesta para poder enviar." : ""; return; }
  $("mensaje").textContent = (blancas.length ? `Sin responder: ${blancas.length === 1 ? "pregunta" : "preguntas"} ${numeros(blancas)}. Puedes volver a ellas o enviar así. ` : "")
    + "Después de pulsar «Responder» ya no podrás cambiar tus respuestas.";
}

function pintar() {
  $("zona").innerHTML = "";
  $("mensaje").textContent = "";
  if (enResumen()) pintarResumen(); else pintarPregunta();
  if (enviando) { $("mensaje").textContent = "Enviando…"; $("zona").querySelectorAll("button, input, textarea").forEach(c => c.disabled = true); }
  mostrarCodigo();
}

// Pantalla final: lo que se marcó en cada pregunta (se puede tocar para corregir) y el botón "Responder"
function pintarResumen() {
  const zona = $("zona");
  const listo = !pendientes().length;
  $("pregunta").textContent = listo ? "Tus respuestas quedaron registradas" : "Revisa y responde";
  const lista = document.createElement("div");
  lista.className = "resumen";
  tanda.forEach((q, i) => {
    const ya = enviada(q);
    const r = ya !== null ? ya || null : respuestaDe(q);
    const invalida = ya === null && r === null && borrador(q).trim() !== ""; // p. ej. un número mal escrito
    const b = document.createElement("button");
    b.className = "fila";
    const t = document.createElement("span");
    t.textContent = `${i + 1}. ${q.texto}`;
    const a = document.createElement("small");
    a.textContent = r !== null ? r.split(SEP).join(", ") : invalida ? "Número no válido: tócala para corregirlo" : "Sin responder";
    if (r === null) a.className = "falta";
    b.append(t, a);
    if (listo) b.disabled = true; // ya enviada: no se corrige desde aquí
    else b.onclick = () => ir(i - idx);
    lista.appendChild(b);
  });
  zona.appendChild(lista);
  if (listo) $("mensaje").textContent = LISTO;
  else panelEnvio();
}

function pintarPregunta() {
  const zona = $("zona");
  const ya = enviada(p);
  const cur = ya !== null ? ya : borrador(p);
  const editable = ya === null;
  if (ya === "") $("mensaje").textContent = "Enviaste la tanda sin responder esta pregunta. Si se abre una nueva ronda, podrás responderla aquí mismo.";
  else if (ya !== null) $("mensaje").textContent = hayResumen() ? LISTO : "Tu respuesta quedó registrada. Si se abre una nueva ronda, podrás responder de nuevo aquí mismo.";
  else if (hayResumen() && respuestaDe(p) !== null) $("mensaje").textContent = "Aún no se envía: puedes cambiarla o quitarla hasta pulsar «Responder» al final.";
  const marcar = v => { if (v) guardar(claveBorr(p.id), v); else olvidar(claveBorr(p.id)); pintar(); };

  if (p.tipo === "alt") {
    const cont = document.createElement("div");
    cont.className = "opciones";
    const elegidas = cur ? cur.split(SEP) : [];
    p.opciones.forEach(op => {
      const b = boton(op);
      const esta = elegidas.includes(op);
      if (esta) b.classList.add("elegida");
      if (!editable) b.disabled = true;
      else if (p.multi) { b.setAttribute("aria-pressed", esta ? "true" : "false"); b.onclick = () => marcar(p.opciones.filter(o => o === op ? !esta : elegidas.includes(o)).join(SEP)); }
      else b.onclick = () => marcar(esta ? "" : op); // tocar de nuevo la elegida la quita
      cont.appendChild(b);
    });
    zona.appendChild(cont);
  }

  if (p.tipo === "esc") {
    const cont = document.createElement("div");
    cont.className = "opciones escala";
    for (let v = p.min; v <= p.max; v++) {
      const b = boton(String(v));
      if (cur === String(v)) b.classList.add("elegida");
      if (!editable) b.disabled = true;
      else b.onclick = () => marcar(cur === String(v) ? "" : String(v));
      cont.appendChild(b);
    }
    zona.appendChild(cont);
    if (p.etqMin || p.etqMax) {
      const ext = document.createElement("div");
      ext.className = "extremos";
      ext.innerHTML = "<span></span><span></span>";
      ext.children[0].textContent = p.etqMin || "";
      ext.children[1].textContent = p.etqMax || "";
      zona.appendChild(ext);
    }
  }

  if (p.tipo === "num") {
    const fila = document.createElement("div");
    fila.className = "numero";
    const inp = document.createElement("input");
    inp.inputMode = "decimal";
    inp.placeholder = "Escribe un número";
    inp.value = cur;
    if (!editable) inp.disabled = true;
    else inp.oninput = () => guardar(claveBorr(p.id), inp.value);
    fila.appendChild(inp);
    if (p.unidad) { const u = document.createElement("span"); u.textContent = p.unidad; fila.appendChild(u); }
    zona.appendChild(fila);
  }

  if (p.tipo === "abi") {
    const ta = document.createElement("textarea");
    ta.rows = 3;
    ta.maxLength = 200;
    ta.placeholder = "Escribe tu respuesta";
    ta.value = cur;
    const cuenta = document.createElement("div");
    cuenta.className = "cuenta";
    cuenta.textContent = ta.value.length + " / 200";
    if (!editable) ta.disabled = true;
    else ta.oninput = () => { cuenta.textContent = ta.value.length + " / 200"; guardar(claveBorr(p.id), ta.value); };
    zona.append(ta, cuenta);
  }

  // Última pregunta: lleva a la pantalla final. Si la tanda es de una sola, el botón "Responder" va aquí mismo
  if (!hayResumen()) panelEnvio();
  else if (idx === tanda.length - 1) {
    const rev = boton("Revisar y responder ›", "enviar");
    rev.onclick = () => ir(1);
    zona.appendChild(rev);
  }
}
</script>
</body>
</html>
