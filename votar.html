<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Responder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script src="config.js"></script>
<script src="repo.js"></script>
<style>
  main { max-width: 560px; margin: 0 auto; padding: 28px 20px 48px; }
  h1 { font-size: 24px; line-height: 1.3; margin: 0 0 22px; }
  .opciones { display: grid; gap: 12px; }
  .opcion {
    text-align: left; font-size: 20px; padding: 16px 18px; min-height: 60px;
    background: #fff; border: 2px solid var(--riel); border-radius: 6px;
  }
  .opcion[aria-pressed="true"], .opcion.elegida { background: var(--barra); border-color: var(--barra); color: #fff; }
  .opcion:disabled:not(.elegida) { opacity: .5; cursor: default; }
  .escala { display: grid; grid-template-columns: repeat(auto-fit, minmax(46px, 1fr)); gap: 8px; }
  .escala .opcion { text-align: center; padding: 14px 0; }
  .extremos { display: flex; justify-content: space-between; color: var(--suave); margin-top: 8px; font-size: 16px; }
  textarea, input {
    width: 100%; font: inherit; font-size: 20px; padding: 12px 14px; color: var(--tinta);
    border: 2px solid var(--riel); border-radius: 6px; background: #fff;
  }
  textarea:focus, input:focus { outline: none; border-color: var(--barra); }
  .numero { display: flex; gap: 10px; align-items: center; font-size: 20px; }
  .enviar {
    margin-top: 14px; width: 100%; font-size: 20px; padding: 14px; border: 0; border-radius: 6px;
    background: var(--barra); color: #fff;
  }
  .enviar:disabled { opacity: .5; cursor: default; }
  .cuenta { text-align: right; color: var(--suave); font-size: 14px; margin-top: 4px; }
  #mensaje { font-size: 18px; color: var(--suave); margin-top: 20px; }
</style>
</head>
<body>
<main>
  <h1 id="pregunta">Cargando…</h1>
  <div id="zona"></div>
  <p id="mensaje" aria-live="polite"></p>
  <p id="error" class="error"></p>
</main>

<script>
let p = null;
let ronda = null;
const LISTO = "Tu respuesta quedó registrada. Si se abre una nueva ronda, podrás responder de nuevo aquí mismo.";
const claveVoto = r => `voto-${p.id}-${r}`;
const espera = ms => new Promise(res => setTimeout(res, ms));

iniciar();

async function iniciar() {
  const qs = new URLSearchParams(location.search);
  try {
    if (qs.get("clase")) {
      const c = await cargarClase(qs.get("clase"));
      p = c.p.find(x => x.id === qs.get("q")) || null;
    } else {
      p = desempaquetar(location.hash.slice(1));
    }
  } catch (e) { p = null; }
  if (!p) {
    $("pregunta").textContent = "Este enlace no es válido. Vuelve a escanear el QR.";
    return;
  }
  $("pregunta").textContent = p.texto;
  estado();
  setInterval(estado, 8000); // detecta si se abre una nueva ronda
}

async function estado() {
  try {
    const d = await api({ accion: "estado", q: p.id });
    if (d.ronda !== ronda) { ronda = d.ronda; pintar(); }
    $("error").textContent = "";
  } catch (e) {
    $("error").textContent = "No hay conexión con el servidor. Reintentando…";
  }
}

async function enviar(r) {
  $("error").textContent = "";
  $("mensaje").textContent = "Enviando…";
  for (let k = 1; k <= 3; k++) {
    try {
      const d = await api({ accion: "enviar", q: p.id, r, t: p.texto });
      $("mensaje").textContent = "";
      return d;
    } catch (e) {
      if (k < 3) await espera(1200 * k);
    }
  }
  $("mensaje").textContent = "";
  $("error").textContent = "No se pudo enviar tu respuesta. Inténtalo de nuevo.";
  return null;
}

// Para alternativas, escala y número: una respuesta por ronda
async function responderUnaVez(r) {
  const controles = $("zona").querySelectorAll("button, input");
  controles.forEach(c => c.disabled = true);
  const d = await enviar(r);
  if (d) {
    localStorage.setItem(claveVoto(d.ronda), r);
    ronda = d.ronda;
    pintar();
  } else {
    controles.forEach(c => c.disabled = false);
  }
}

function boton(texto, clase = "opcion") {
  const b = document.createElement("button");
  b.className = clase;
  b.textContent = texto;
  return b;
}

function pintar() {
  const zona = $("zona");
  zona.innerHTML = "";
  const ya = p.tipo === "abi" ? null : localStorage.getItem(claveVoto(ronda));
  $("mensaje").textContent = ya ? LISTO : "";

  if (p.tipo === "alt") {
    const cont = document.createElement("div");
    cont.className = "opciones";
    const elegidas = ya ? ya.split(SEP) : [];
    p.opciones.forEach(op => {
      const b = boton(op);
      if (ya) { b.disabled = true; if (elegidas.includes(op)) b.classList.add("elegida"); }
      else if (p.multi) { b.setAttribute("aria-pressed", "false"); b.onclick = () => b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true"); }
      else b.onclick = () => { b.classList.add("elegida"); responderUnaVez(op); };
      cont.appendChild(b);
    });
    zona.appendChild(cont);
    if (p.multi && !ya) {
      const env = boton("Enviar", "enviar");
      env.onclick = () => {
        const sel = [...cont.children].filter(b => b.getAttribute("aria-pressed") === "true").map(b => b.textContent);
        if (!sel.length) { $("error").textContent = "Marca al menos una alternativa."; return; }
        responderUnaVez(sel.join(SEP));
      };
      zona.appendChild(env);
    }
  }

  if (p.tipo === "esc") {
    const cont = document.createElement("div");
    cont.className = "opciones escala";
    for (let v = p.min; v <= p.max; v++) {
      const b = boton(String(v));
      if (ya) { b.disabled = true; if (ya === String(v)) b.classList.add("elegida"); }
      else b.onclick = () => { b.classList.add("elegida"); responderUnaVez(String(v)); };
      cont.appendChild(b);
    }
    zona.appendChild(cont);
    if (p.etqMin || p.etqMax) {
      const ext = document.createElement("div");
      ext.className = "extremos";
      ext.innerHTML = "<span></span><span></span>";
      ext.children[0].textContent = p.etqMin || "";
      ext.children[1].textContent = p.etqMax || "";
      zona.appendChild(ext);
    }
  }

  if (p.tipo === "num") {
    const fila = document.createElement("div");
    fila.className = "numero";
    const inp = document.createElement("input");
    inp.inputMode = "decimal";
    inp.placeholder = "Escribe un número";
    fila.appendChild(inp);
    if (p.unidad) { const u = document.createElement("span"); u.textContent = p.unidad; fila.appendChild(u); }
    zona.appendChild(fila);
    const env = boton("Enviar", "enviar");
    zona.appendChild(env);
    if (ya) { inp.value = ya; inp.disabled = true; env.disabled = true; }
    else env.onclick = () => {
      if (aNumero(inp.value) === null) { $("error").textContent = "Escribe solo un número (por ejemplo 12,5)."; return; }
      responderUnaVez(inp.value.trim());
    };
  }

  if (p.tipo === "abi") {
    const ta = document.createElement("textarea");
    ta.rows = 3;
    ta.maxLength = 200;
    ta.placeholder = "Escribe tu respuesta";
    const cuenta = document.createElement("div");
    cuenta.className = "cuenta";
    cuenta.textContent = "0 / 200";
    ta.oninput = () => cuenta.textContent = ta.value.length + " / 200";
    const env = boton("Enviar", "enviar");
    env.onclick = async () => {
      const r = ta.value.trim();
      if (!r) { $("error").textContent = "Escribe algo antes de enviar."; return; }
      env.disabled = true;
      const d = await enviar(r);
      env.disabled = false;
      if (d) { ta.value = ""; cuenta.textContent = "0 / 200"; $("mensaje").textContent = "Enviado. Puedes escribir otra respuesta si quieres."; }
    };
    zona.append(ta, cuenta, env);
  }
}
</script>
</body>
</html>
